# =============================================================================
# Concord — coturn
#
# Autenticacao por segredo compartilhado (use-auth-secret). O backend deriva
# credenciais efemeras desse segredo por HMAC-SHA1 e as entrega ao navegador em
# GET /api/webrtc/ice. O segredo em si NUNCA sai do servidor.
#
# Credencial estatica embutida no frontend — o caminho comum em tutoriais —
# transformaria este servidor em relay aberto assim que alguem abrisse o
# DevTools.
# =============================================================================

listening-port=3478
tls-listening-port=5349

# O container roda em network_mode: host. TURN precisa alocar uma faixa larga de
# portas UDP para o relay, e mapear milhares de portas pelo bridge do Docker e
# lento e fragil.
min-port=49160
max-port=49200

fingerprint
use-auth-secret

# Preenchidos a partir do .env pelo docker-compose (envsubst nao e usado: os
# valores vem por argumento de linha de comando, ver docker-compose.yml).
# static-auth-secret e realm sao passados como --static-auth-secret e --realm.

# --- Endurecimento -----------------------------------------------------------

# Sem essas linhas, o TURN pode ser usado para alcancar a rede interna do
# servidor — inclusive o proprio PostgreSQL e o painel do Mailpit.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Protocolos legados e desligados: nao ha cliente que precise deles.
no-tlsv1
no-tlsv1_1

# Quotas do coturn contam ALOCACOES simultaneas, nao banda.
#   user-quota  = alocacoes por credencial
#   total-quota = alocacoes no servidor inteiro
# Uma chamada relayada consome 1 alocacao por participante que precisa de relay.
user-quota=6
total-quota=600

# Banda por sessao, em bytes por segundo. ESTE e o limite que protege o link.
# 750 kB/s ~= 6 Mbit/s: cabe video 720p com folga e impede que uma unica sessao
# consuma o servidor inteiro.
max-bps=750000

# Teto agregado, tambem em bytes por segundo. Deixe abaixo da capacidade real do
# link para que o TURN nunca sature a interface e derrube o resto do sistema.
# 100 MB/s ~= 800 Mbit/s.
bps-capacity=100000000

# O log padrao registra IPs de cada alocacao. Em producao, ajuste conforme a
# politica de retencao — este arquivo e a fonte mais rica de metadados de rede
# do sistema inteiro.
simple-log
no-stdout-log
log-file=stdout
verbose
