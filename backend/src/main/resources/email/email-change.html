<!doctype html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background-color:#0b1220;font-family:-apple-system,Segoe UI,Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b1220;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#121c2e;border:1px solid #223250;border-radius:6px;padding:32px;">
          <tr>
            <td style="color:#7b8dae;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding-bottom:8px;">
              Concord
            </td>
          </tr>
          <tr>
            <td style="color:#dbe5f4;font-size:22px;font-weight:600;padding-bottom:16px;">
              Confirme seu novo e-mail
            </td>
          </tr>
          <tr>
            <td style="color:#dbe5f4;font-size:15px;line-height:1.6;padding-bottom:24px;">
              Olá, {{displayName}}. Para concluir a troca de endereço, confirme que
              este e-mail é seu.
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;">
              <a href="{{link}}" style="display:inline-block;background-color:#f2b134;color:#0b1220;text-decoration:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:4px;">
                Confirmar novo e-mail
              </a>
            </td>
          </tr>
          <tr>
            <td style="color:#7b8dae;font-size:13px;line-height:1.6;">
              O link vale por 2 horas. Até a confirmação, o endereço antigo continua ativo.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
