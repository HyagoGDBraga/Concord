# =============================================================================
# Concord — configuracao base (comum a todos os perfis)
# Valores sensiveis vem SEMPRE de variaveis de ambiente. Nenhum segredo aqui.
# =============================================================================

spring:
  servlet:
    multipart:
      # 5 MiB por arquivo. O Spring recusa ANTES de o corpo inteiro chegar a
      # memoria; sem este limite, um arquivo de 2 GB seria lido primeiro e
      # rejeitado depois.
      max-file-size: 5MB
      max-request-size: 6MB
      # Acima disto, o Spring grava em disco em vez de segurar na memoria.
      file-size-threshold: 256KB
  application:
    name: concord

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      # O schema pertence ao Flyway. O Hibernate apenas confere se o mapeamento
      # bate com o banco — nunca cria nem altera tabela.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  session:
    store-type: jdbc
    timeout: 7d
    jdbc:
      # O schema do Spring Session esta versionado em V1__init.sql.
      initialize-schema: never
      table-name: SPRING_SESSION

  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
        transport:
          protocol: smtp

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

# --- configuracao propria da aplicacao ---------------------------------------
concord:
  # Base dos links enviados por e-mail. Precisa apontar para o FRONTEND.
  public-url: ${APP_PUBLIC_URL:http://localhost}
  # Valor inicial de registration.open. Depois da primeira subida, quem manda e
  # o app_settings, alteravel pelo painel administrativo.
  registration-open: ${REGISTRATION_OPEN:true}
  # E-mail que pode ser promovido a ADMIN uma unica vez. Pode ficar vazio.
  bootstrap-admin-email: ${CONCORD_BOOTSTRAP_ADMIN_EMAIL:}
  # Prazo para expurgo de contas que nunca confirmaram o e-mail.
  unverified-account-ttl: ${UNVERIFIED_ACCOUNT_TTL:7d}
  mail:
    from: ${MAIL_FROM:nao-responda@concord.local}
    from-name: Concord
  login:
    # Falhas toleradas antes do primeiro bloqueio temporario.
    max-failed-attempts: 5
    # Backoff exponencial: 1, 2, 4, 8, 15, 15... minutos.
    lock-base-duration: 1m
    lock-max-duration: 15m
  turn:
    enabled: ${TURN_ENABLED:false}
    stun-url: ${TURN_STUN_URL:stun:stun.l.google.com:19302}
    urls: ${TURN_URLS:}
    # Segredo compartilhado com o coturn. Nunca vai ao navegador: o backend
    # deriva credenciais efemeras por HMAC-SHA1.
    secret: ${TURN_SECRET:}
    credential-ttl: 1h
  legal:
    # Mudar a versao invalida os aceites anteriores e faz o sistema pedir um
    # aceite novo. E o comportamento desejado quando o texto muda.
    terms-version: ${LEGAL_TERMS_VERSION:2026-01}
    privacy-version: ${LEGAL_PRIVACY_VERSION:2026-01}
  storage:
    # Pasta dos anexos. Em desenvolvimento e uma pasta local; em producao, um
    # volume Docker — ver docker-compose. Precisa existir e ser gravavel: o
    # FileStorage cria a pasta na inicializacao e a aplicacao NAO sobe se
    # falhar, porque servir upload sem lugar para gravar seria pior.
    path: ${STORAGE_PATH:/var/concord/uploads}
  webhook:
    # Segredo do webhook de bounce. Vazio DESLIGA o endpoint por completo — ele
    # nao fica aberto por esquecimento.
    email-secret: ${EMAIL_WEBHOOK_SECRET:}

server:
  port: 8080
  servlet:
    # Todo o backend vive sob /api. O Caddy repassa o caminho inteiro.
    context-path: /api
    session:
      timeout: 7d
      cookie:
        name: ${SESSION_COOKIE_NAME:concord_session}
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        path: /
  # Confia nos X-Forwarded-* do Caddy, para que ClientIp resolva o IP real.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
    mail:
      # Desligado: uma indisponibilidade momentanea do SMTP nao deve marcar a
      # aplicacao inteira como fora do ar.
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Concord
    version: 0.2.0
    phase: 2

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:--}] %logger{36} - %msg%n"
