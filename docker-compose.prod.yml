# =============================================================================
# Concord — ambiente de DESENVOLVIMENTO
#
#   cp .env.example .env
#   docker compose up -d
#   → http://localhost
#
# A composição de produção (TLS real, coturn, imagens compiladas) entra na
# Fase 9, em docker-compose.prod.yml.
# =============================================================================

name: concord

services:
  postgres:
    image: postgres:16-alpine
    container_name: concord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Melhora o desempenho de checksum em dev sem afetar durabilidade real.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Publicado apenas no loopback, para conectar um DBeaver/psql local. O
      # backend NÃO usa esta porta — ele fala com o banco pela rede interna.
      #
      # A porta do host é configurável porque 5432 costuma já estar ocupada por
      # um PostgreSQL instalado na máquina. No Windows o Docker Desktop relata
      # isso como "forbidden by its access permissions", que parece problema de
      # permissão mas é conflito de porta. Confira com:
      #   netstat -ano | findstr :5432        (Windows)
      #   ss -tlnp | grep 5432                (Linux)
      # Havendo conflito, defina POSTGRES_HOST_PORT=5433 no .env.
      #
      # Manter portas distintas também evita um erro pior: um cliente SQL
      # apontado para 5432 conectaria no banco errado sem avisar.
      #
      # Em produção esta publicação não existe (docker-compose.prod.yml).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [concord]

  backend:
    build:
      context: ./backend
      target: dev
    container_name: concord-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN}
      UNVERIFIED_ACCOUNT_TTL: ${UNVERIFIED_ACCOUNT_TTL}
      CONCORD_BOOTSTRAP_ADMIN_EMAIL: ${CONCORD_BOOTSTRAP_ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      MAIL_FROM: ${MAIL_FROM}
      TURN_ENABLED: ${TURN_ENABLED}
      TURN_STUN_URL: ${TURN_STUN_URL}
      TURN_URLS: ${TURN_URLS}
      TURN_SECRET: ${TURN_SECRET}
      LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION}
      LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET}
    volumes:
      # Hot reload: o DevTools reinicia a aplicação quando as classes mudam.
      - ./backend/src:/build/src
      - ./backend/pom.xml:/build/pom.xml
      # Cache do Maven entre rebuilds — sem isso cada build baixa o mundo.
      - maven_repo:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [concord]

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: concord-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      # Necessário para o file watcher enxergar mudanças em volumes montados
      # no Docker Desktop (macOS/Windows).
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Volumes anônimos protegem node_modules e .next do bind mount do host.
      - /app/node_modules
      - /app/.next
    networks: [concord]

  mailpit:
    # Captura os e-mails de verificação e reset em dev. Nada sai para a
    # internet; a caixa de entrada fica em http://localhost:8025
    image: axllent/mailpit:latest
    container_name: concord-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:8025:8025"
    networks: [concord]

  caddy:
    image: caddy:2-alpine
    container_name: concord-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks: [concord]

  # --- TURN -----------------------------------------------------------------
  # Retransmite midia quando os pares nao conseguem falar direto (NAT simetrico,
  # redes corporativas). Em rede local o STUN basta e este servico fica ocioso.
  #
  # network_mode: host e obrigatorio, nao preferencia: o TURN aloca uma faixa
  # larga de portas UDP, e publicar milhares de portas pelo bridge do Docker e
  # lento e pouco confiavel. A contrapartida e que o container ignora a rede
  # 'concord' e enxerga a interface do host diretamente.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: concord-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM}
      --external-ip=${TURN_EXTERNAL_IP}
    profiles: ["turn"]


volumes:
  postgres_data:
  maven_repo:
  caddy_data:
  caddy_config:

networks:
  concord:
    driver: bridge