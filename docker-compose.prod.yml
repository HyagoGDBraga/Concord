# =============================================================================
# Concord — PRODUÇÃO
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Este arquivo é um OVERRIDE do docker-compose.yml, não um substituto. Ele
# altera o que muda em produção e herda o resto — o que evita a divergência
# silenciosa entre dois arquivos completos que ninguém mantém em sincronia.
#
# EXIGE Docker Compose >= 2.24: as tags !override e !reset foram introduzidas
# nessa versão. Confira com `docker compose version`.
# =============================================================================

services:
  postgres:
    # Sem porta publicada: só a rede interna alcança o banco.
    ports: !override []
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 2G
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_PATH: /var/concord/uploads
      # MaxRAMPercentage faz a JVM respeitar o limite do container. Sem isso ela
      # calcula o heap pela RAM do HOST e é morta pelo OOM killer quando cresce.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+UseSerialGC
        -Djava.security.egd=file:/dev/urandom
    # Troca os binds de desenvolvimento pelo volume de anexos. Sem esta linha,
    # os arquivos enviados viveriam dentro do container e sumiriam no próximo
    # deploy — um avatar que desaparece a cada atualização é pior que não ter.
    volumes: !override
      - uploads_data:/var/concord/uploads
    deploy:
      resources:
        limits:
          memory: 1500M
    logging: *logging

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: /api/ws
    volumes: !override []
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Mailpit não existe em produção.
  mailpit:
    profiles: ["nunca"]
    deploy:
      replicas: 0

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CONCORD_DOMAIN: ${CONCORD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    logging: *logging

  coturn:
    # Em produção o TURN não é opcional: sem ele, chamadas falham em NAT
    # simétrico e em qualquer rede corporativa.
    profiles: !override []
    logging: *logging
