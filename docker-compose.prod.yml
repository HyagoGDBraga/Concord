# =============================================================================
# Concord — PRODUÇÃO
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Este arquivo é um OVERRIDE do docker-compose.yml, não um substituto. Ele
# altera o que muda em produção e herda o resto — o que evita a divergência
# silenciosa entre dois arquivos completos que ninguém mantém em sincronia.
#
# O que ele muda:
#   * imagens compiladas (target runtime) no lugar dos alvos de desenvolvimento
#   * TLS real via Caddyfile.prod, com certificado automático
#   * PostgreSQL sem porta publicada — só a rede interna o alcança
#   * Mailpit removido
#   * coturn ligado por padrão
#   * limites de memória e rotação de log
#
# EXIGE Docker Compose >= 2.24: as tags !override e !reset usadas abaixo foram
# introduzidas nessa versão. Confira com `docker compose version`.
# =============================================================================

services:
  postgres:
    # Sem 'ports'. O compose faz merge de listas, então não há como remover a
    # publicação herdada por sobrescrita — a solução é o override abaixo, que
    # amarra a porta ao loopback do container e a torna inalcançável de fora.
    ports: !override []
    environment:
      # Ajustes conservadores para uma máquina de 12 GB compartilhada com o
      # backend, o frontend e o coturn. Não é tuning agressivo: é o suficiente
      # para o PostgreSQL não operar com os padrões de laptop.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      # WAL para permitir backup consistente sob carga.
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=1GB
      # Registra consultas lentas. É o primeiro lugar a olhar quando algo
      # ficar lento em produção.
      - -c
      - log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 2G
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # -XX:MaxRAMPercentage faz a JVM respeitar o limite do container. Sem
      # isso ela calcula o heap a partir da RAM do HOST e é morta pelo OOM
      # killer quando cresce — a causa mais comum de "o backend reinicia
      # sozinho" em container.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+UseSerialGC
        -Djava.security.egd=file:/dev/urandom
    volumes: !override []
    deploy:
      resources:
        limits:
          memory: 1500M
    logging: *logging

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: /api/ws
    volumes: !override []
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Mailpit não existe em produção. 'replicas: 0' o mantém definido mas nunca
  # iniciado — mais explícito do que herdar um serviço e torcer para ninguém
  # subir por engano.
  mailpit:
    deploy:
      replicas: 0
    profiles: ["nunca"]

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      # HTTP/3. O Caddy negocia sozinho; sem esta porta o navegador apenas
      # continua no HTTP/2.
      - "443:443/udp"
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CONCORD_DOMAIN: ${CONCORD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    logging: *logging

  coturn:
    # Em produção o TURN não é opcional: sem ele, chamadas falham em NAT
    # simétrico e em qualquer rede corporativa.
    profiles: !override []
    logging: *logging
