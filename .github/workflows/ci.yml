name: CI

# Roda em todo push e em todo pull request. O objetivo nao e cerimonia: sao sete
# fases de codigo escrito sem build executado, e a partir daqui nenhuma
# alteracao entra sem passar por aqui.
on:
  push:
    branches: [main]
  pull_request:

# Cancela execucoes antigas do mesmo branch: o resultado do commit anterior
# deixou de interessar assim que veio um novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    # Testcontainers sobe um PostgreSQL de verdade. O runner do GitHub ja tem
    # Docker disponivel, entao nao e preciso servico auxiliar — e o teste roda
    # contra o mesmo banco de producao, nao contra um H2 que se comporta
    # diferente.
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e testar
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint + tipos + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        # 'ci' e nao 'install': respeita o package-lock.json exatamente, sem
        # atualizar versao nenhuma por conta propria.
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verificacao de tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  seguranca:
    name: Seguranca das dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditoria do npm
        working-directory: frontend
        # Falha apenas em vulnerabilidade alta ou critica. Quebrar o build por
        # aviso de severidade baixa treina todo mundo a ignorar o resultado.
        run: npm audit --audit-level=high

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dependencias Java desatualizadas
        working-directory: backend
        # Informativo, nao bloqueante: versao nova nem sempre e versao segura, e
        # atualizar sob pressao de CI vermelho e como se introduz regressao.
        run: mvn -B --no-transfer-progress versions:display-dependency-updates || true

  e2e:
    name: Ponta a ponta
    runs-on: ubuntu-latest
    # So roda se backend e frontend passaram: nao adianta subir o ambiente
    # inteiro para descobrir um erro de compilacao.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar configuracao
        run: |
          cp .env.example .env
          # Senha descartavel para o ambiente efemero do CI.
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env

      - name: Subir o ambiente
        run: docker compose up -d --build

      - name: Aguardar o backend responder
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/api/actuator/health > /dev/null; then
              echo "Backend no ar apos ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend nao respondeu em 60s"
          docker compose logs --tail=100 backend
          exit 1

      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Executar testes ponta a ponta
        working-directory: frontend
        run: npm run test:e2e

      - name: Guardar evidencias da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-relatorio
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Logs dos servicos em caso de falha
        if: failure()
        run: docker compose logs --tail=200
